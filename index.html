<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>My New Ecommerce</title>
  
  </head>
  <body>
    <header>
      <nav>
        <div class="logo">MyStore</div>
        <div class="nav-links">
          <a href="#">Home</a>
          <a href="#">Shop</a>
          <a href="#">About</a>
          <a href="#">Contact</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="hero">
        <h1>Fresh Finds for Everyday Living</h1>
        <p>Shop trending products at great prices.</p>
        <a href="#products" class="cta">Shop Now</a>
      </section>

      <section id="products" class="products">
        <article class="product">
          <img src="https://via.placeholder.com/300x200" alt="Product 1" />
          <h3>Classic Chair</h3>
          <p>Modern comfort with timeless design.</p>
          <div class="price">$89</div>
        </article>

        <article class="product">
          <img src="https://via.placeholder.com/300x200" alt="Product 2" />
          <h3>Wireless Headphones</h3>
          <p>Premium sound and all-day battery.</p>
          <div class="price">$129</div>
        </article>

        <article class="product">
          <img src="https://via.placeholder.com/300x200" alt="Product 3" />
          <h3>Smart Watch</h3>
          <p>Track health, fitness, and notifications.</p>
          <div class="price">$199</div>
        </article>
      </section>
    </main>
  </body>
</html>
